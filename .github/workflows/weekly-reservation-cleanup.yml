name: Weekly reservation cleanup

on:
  schedule:
    # GitHub Actions schedules use UTC. Run Sunday at 06:17 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-old-reservations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ForFutureEJS/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ForFutureEJS

      - name: Delete reservations older than seven days
        run: >-
          node -e "require('./server').deleteOldPlannedVisits()
          .then((rows) => console.log('Deleted old reservations:', rows.length))
          .catch((error) => { console.error(error); process.exitCode = 1; });"
        working-directory: ForFutureEJS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GYM_TIME_ZONE: ${{ vars.GYM_TIME_ZONE }}
